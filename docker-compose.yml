services:
  db:
    image: postgres:16-alpine
    container_name: lapinou-dish-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lapinou_dish
      POSTGRES_USER: lapinou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - lapinou_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapinou -d lapinou_dish"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: lapinou-dish
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lapinou_dish
      DB_USER: lapinou
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RECIPE_MODEL: ${OPENAI_RECIPE_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  lapinou_db:
